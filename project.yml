name: Spoon
options:
  bundleIdPrefix: com.wonderland
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: NS2YBVJ86W
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ONLY_ACTIVE_ARCH: NO
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
configs:
  Debug: debug
  Release: release
targets:
  SpoonSVNRunner:
    type: tool
    platform: macOS
    sources: [Sources/SpoonSVNRunner]
    entitlements:
      path: Config/Helper.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.inherit: true
    settings:
      base:
        PRODUCT_NAME: SpoonSVNRunner
        PRODUCT_BUNDLE_IDENTIFIER: com.wonderland.spoon.svn-runner
        SKIP_INSTALL: YES
  SpoonDomain:
    type: framework
    platform: macOS
    sources: [Sources/SpoonDomain]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wonderland.spoon.domain
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  SpoonSecurity:
    type: framework
    platform: macOS
    sources: [Sources/SpoonSecurity]
    dependencies:
      - target: SpoonDomain
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wonderland.spoon.security
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  SpoonStorage:
    type: framework
    platform: macOS
    sources: [Sources/SpoonStorage]
    dependencies:
      - target: SpoonDomain
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wonderland.spoon.storage
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  SpoonSVN:
    type: framework
    platform: macOS
    sources: [Sources/SpoonSVN]
    dependencies:
      - target: SpoonDomain
      - target: SpoonSecurity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wonderland.spoon.svn
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  SpoonDiff:
    type: framework
    platform: macOS
    sources: [Sources/SpoonDiff]
    dependencies:
      - target: SpoonDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wonderland.spoon.diff
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  SpoonDiagnostics:
    type: framework
    platform: macOS
    sources: [Sources/SpoonDiagnostics]
    dependencies:
      - target: SpoonDomain
      - target: SpoonSecurity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wonderland.spoon.diagnostics
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  SpoonUI:
    type: framework
    platform: macOS
    sources: [Sources/SpoonUI]
    dependencies:
      - target: SpoonDomain
      - target: SpoonSecurity
      - target: SpoonStorage
      - target: SpoonSVN
      - target: SpoonDiff
      - target: SpoonDiagnostics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wonderland.spoon.ui
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  Spoon:
    type: application
    platform: macOS
    sources:
      - path: Sources/SpoonApp
      - path: Resources
        buildPhase: resources
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: Config/Spoon.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
    dependencies:
      - target: SpoonSVNRunner
        embed: false
        link: false
      - target: SpoonUI
      - target: SpoonDomain
      - target: SpoonSecurity
      - target: SpoonStorage
      - target: SpoonSVN
      - target: SpoonDiff
      - target: SpoonDiagnostics
    postBuildScripts:
      - name: Embed Bundled SVN Toolchain
        script: '"$SRCROOT/Tools/embed-toolchain.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wonderland.spoon
        PRODUCT_NAME: Spoon
        PRODUCT_MODULE_NAME: SpoonApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spoon
        INFOPLIST_KEY_CFBundleName: Spoon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Yurii Levchenko
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
  SpoonTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/SpoonTests]
    dependencies:
      - target: SpoonDomain
      - target: SpoonSecurity
      - target: SpoonStorage
      - target: SpoonSVN
      - target: SpoonDiff
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wonderland.spoon.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Spoon:
    build:
      targets:
        Spoon: all
        SpoonTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - SpoonTests
    archive:
      config: Release
