name: Spoon
options:
  bundleIdPrefix: com.wonderland
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: NS2YBVJ86W
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ONLY_ACTIVE_ARCH: NO
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
configs:
  Debug: debug
  Release: release
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.17.0
targets:
  SpoonSVNRunner:
    type: tool
    platform: macOS
    sources: [Sources/SpoonSVNRunner]
    entitlements:
      path: Config/Helper.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.inherit: true
    settings:
      base:
        PRODUCT_NAME: SpoonSVNRunner
        PRODUCT_BUNDLE_IDENTIFIER: com.wonderland.spoon.svn-runner
        SKIP_INSTALL: YES
  SpoonDomain:
    type: framework
    platform: macOS
    sources: [Sources/SpoonDomain]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wonderland.spoon.domain
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  SpoonSecurity:
    type: framework
    platform: macOS
    sources: [Sources/SpoonSecurity]
    dependencies:
      - target: SpoonDomain
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wonderland.spoon.security
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  SpoonStorage:
    type: framework
    platform: macOS
    sources: [Sources/SpoonStorage]
    dependencies:
      - target: SpoonDomain
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wonderland.spoon.storage
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  SpoonSVN:
    type: framework
    platform: macOS
    sources: [Sources/SpoonSVN]
    dependencies:
      - target: SpoonDomain
      - target: SpoonSecurity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wonderland.spoon.svn
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  SpoonDiff:
    type: framework
    platform: macOS
    sources: [Sources/SpoonDiff]
    dependencies:
      - target: SpoonDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wonderland.spoon.diff
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  SpoonDiagnostics:
    type: framework
    platform: macOS
    sources: [Sources/SpoonDiagnostics]
    dependencies:
      - target: SpoonDomain
      - target: SpoonSecurity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wonderland.spoon.diagnostics
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  SpoonUI:
    type: framework
    platform: macOS
    sources: [Sources/SpoonUI]
    dependencies:
      - target: SpoonDomain
      - target: SpoonSecurity
      - target: SpoonStorage
      - target: SpoonSVN
      - target: SpoonDiff
      - target: SpoonDiagnostics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wonderland.spoon.ui
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  Spoon:
    type: application
    platform: macOS
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Spoon
        CFBundleName: Spoon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSSupportsOpeningDocumentsInPlace: true
        NSApplicationCrashOnExceptions: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: Copyright © 2026 Yurii Levchenko
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticGraphicsSwitching: true
        FirebaseAppDelegateProxyEnabled: false
        FirebaseCrashlyticsCollectionEnabled: false
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
    sources:
      - path: Sources/SpoonApp
      - path: Resources
        buildPhase: resources
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Config/GoogleService-Info.plist
        buildPhase: resources
    entitlements:
      path: Config/Spoon.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.wonderland.spoon"
    dependencies:
      - target: SpoonSVNRunner
        embed: false
        link: false
      - target: SpoonUI
      - target: SpoonDomain
      - target: SpoonSecurity
      - target: SpoonStorage
      - target: SpoonSVN
      - target: SpoonDiff
      - target: SpoonDiagnostics
      - package: Firebase
        product: FirebaseAnalyticsCore
      - package: Firebase
        product: FirebaseCrashlytics
    postBuildScripts:
      - name: Embed Bundled SVN Toolchain
        script: '"$SRCROOT/Tools/embed-toolchain.sh"'
        basedOnDependencyAnalysis: false
      - name: Upload Crashlytics Symbols
        script: '"${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"'
        inputFiles:
          - "$(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)"
          - "$(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Resources/DWARF/$(PRODUCT_NAME)"
          - "$(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Info.plist"
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist"
          - "$(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)"
          - "$(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Resources/DWARF/$(PRODUCT_NAME).debug.dylib"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wonderland.spoon
        PRODUCT_NAME: Spoon
        PRODUCT_MODULE_NAME: SpoonApp
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        OTHER_LDFLAGS: "$(inherited) -ObjC"
  SpoonTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/SpoonTests]
    dependencies:
      - target: SpoonDomain
      - target: SpoonSecurity
      - target: SpoonStorage
      - target: SpoonSVN
      - target: SpoonDiff
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wonderland.spoon.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Spoon:
    build:
      targets:
        Spoon: all
        SpoonTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - SpoonTests
    archive:
      config: Release
